[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-openharness"
version = "0.6.0"
description = "A small, interview-ready coding agent harness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.20",
    "mcp>=1.28,<2",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
wqb = "mini_openharness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_openharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
