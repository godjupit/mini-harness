[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-openharness"
version = "0.2.0"
description = "A small, interview-ready coding agent harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "jsonschema>=4.20", "mcp>=1.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mini-oh = "mini_openharness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_openharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
